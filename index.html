<!DOCTYPE html>
<html lang="th">
<head>

    <title>SIRISUK GANG - หน้าแรก</title> 
    <!-- เรียกใช้งานฟอนต์ Prompt จาก Google Fonts -->

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #171717 100%);
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <header class="w-full bg-black/60 backdrop-blur-md border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-white text-lg md:text-xl font-semibold tracking-wider flex items-center gap-2">

            </nav>
            <!-- Mobile Menu Toggle Button -->
            <button class="md:hidden text-white focus:outline-none text-2xl">
                ☰
            </button>
        </div>
    </header>

    <main class="flex-grow flex justify-center items-center p-6">
        <div class="w-full max-w-[480px] text-center">
            <!-- รูปโปรไฟล์จำลอง -->
            <div class="w-24 h-24 bg-neutral-800 border border-neutral-700 rounded-full mx-auto mb-6 flex items-center justify-center text-4xl shadow-inner">
                🏴
            </div>
            
            <!-- หัวข้อและคำอธิบาย -->
            <h1 class="text-2xl md:text-3xl font-bold text-white mb-3 tracking-wide">ยินดีต้อนรับสู่ SIRISUK GANG</h1>
            <p class="text-neutral-400 text-sm md:text-base leading-relaxed mb-8">
                พื้นที่ศูนย์รวมความบันเทิงและไลฟ์สไตล์สุดคูล ดีไซน์มินิมอลโทนขาวดำ หรูหรา สะอาดตา และทันสมัย

            <!-- ปุ่มกดเชื่อมโยงไปยังที่ต่างๆ -->

                <a href="#" class="block w-full py-3.5 bg-neutral-900 text-neutral-200 border border-neutral-800 rounded-xl font-semibold hover:bg-white hover:text-black transition-all duration-300 shadow-sm">โปรเจกต์ GitHub</a>
            </div>
        </div>
    </main>

    <footer class="text-center py-6 text-neutral-500 text-xs tracking-wider border-t border-white/5">
        &copy; 2026 SIRISUK GANG. สงวนลิขสิทธิ์ทุกประการ.
    </footer>

</html>
